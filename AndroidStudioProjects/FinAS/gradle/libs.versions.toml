[versions]
androidGradlePlugin = "8.7.2"
kotlin = "2.0.20"
jbcrypt = "0.4"
coreKtx = "1.12.0"
material = "1.12.0"
constraintlayout = "2.1.4"
mpandroidchart = "v3.1.0"
navigation = "2.7.7"
coroutines = "1.10.2"
recyclerview = "1.3.2"
appcompat = "1.6.1"
lifecycle = "2.8.6"
activity = "1.9.3"
databinding = "8.7.0"
itext7 = "7.2.5"
poi = "5.2.3"
poi-ooxml = "5.2.3"
protoliteWellKnownTypes = "18.0.1"

[libraries]
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
material = { module = "com.google.android.material:material", version.ref = "material" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
mpandroidchart = { group = "com.github.PhilJay", name = "MPAndroidChart", version.ref = "mpandroidchart" }
navigation-fragment-ktx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }
jbcrypt = { module = "org.mindrot:jbcrypt", version.ref = "jbcrypt" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
databinding-runtime = { module = "androidx.databinding:databinding-runtime", version.ref = "databinding" }
itext7-core = { module = "com.itextpdf:itext7-core", version.ref = "itext7" }
poi = { module = "org.apache.poi:poi", version.ref = "poi" }
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi-ooxml" }
protolite-types = { group = "com.google.firebase", name = "protolite-well-known-types", version.ref = "protoliteWellKnownTypes" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }